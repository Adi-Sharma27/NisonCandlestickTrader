name: Build Nison Candlestick Trader APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Install Capacitor & Generate Standalone Android Project
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Generate Launcher Icons & Inject Permissions
        run: |
          python3 - << 'EOF'
          import os, zlib, struct

          def make_png(w, h, rgba):
              raw = b''.join(b'\x00' + rgba * w for _ in range(h))
              def chunk(tag, data):
                  return struct.pack('!I', len(data)) + tag + data + struct.pack('!I', zlib.crc32(tag + data) & 0xffffffff)
              ihdr = struct.pack('!IIBBBBB', w, h, 8, 6, 0, 0, 0)
              return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', ihdr) + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b'')

          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          res_dir = 'android/app/src/main/res'
          for density, px in sizes.items():
              d = os.path.join(res_dir, f'mipmap-{density}')
              os.makedirs(d, exist_ok=True)
              png_bytes = make_png(px, px, b'\x10\xb9\x81\xff')
              for fname in ('ic_launcher.png', 'ic_launcher_round.png'):
                  with open(os.path.join(d, fname), 'wb') as f:
                      f.write(png_bytes)

          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f:
              xml = f.read()
          perms = '''
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
          '''
          if 'POST_NOTIFICATIONS' not in xml:
              xml = xml.replace('<application', perms + '\n    <application', 1)
          with open(manifest_path, 'w') as f:
              f.write(xml)
          EOF

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Nison Candlestick Trader APK
        uses: actions/upload-artifact@v4
        with:
          name: nison-candlestick-trader-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
